<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoLeitwerk – Mein Fahrzeug</title>
<style>
  :root{
    --bg:#f4f4f7; --panel:#ffffff; --panel2:#f7f6fb; --border:#e6e5f0;
    --accent:#8b5cf6; --accent2:#7c3aed; --text:#1a1a2e; --text-faint:#8a8aa8;
    --green:#22c55e; --greenbg:#e8f9ee; --amber:#f59e0b; --amberbg:#fef6e7;
    --red:#f2495c; --redbg:#fdeaec; --blue:#3b82f6; --bluebg:#eaf1fd;
  }
  @media (prefers-color-scheme: dark) {
    :root{
      --bg:#0d0d16; --panel:#161625; --panel2:#1c1c30; --border:#2a2a45;
      --accent:#a78bfa; --accent2:#c4b5fd; --text:#f0f0f5; --text-faint:#8a8aa8;
      --green:#4ade80; --greenbg:rgba(34,197,94,.16); --amber:#fbbf24; --amberbg:rgba(245,158,11,.16);
      --red:#f87171; --redbg:rgba(242,73,92,.16); --blue:#60a5fa; --bluebg:rgba(59,130,246,.16);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .wrap{max-width:480px;margin:0 auto;padding:0 0 60px;}
  .topbar{background:linear-gradient(135deg,#1a1a2e,#2a1a4e);color:#fff;padding:18px 18px 22px;
    display:flex;align-items:center;gap:12px;border-radius:0 0 18px 18px;}
  .topbar img{height:30px;}
  .topbar .tb-title{font-weight:700;font-size:16px;}
  .topbar .tb-sub{font-size:12px;opacity:.7;}
  .content{padding:16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card-title{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;
    display:flex;align-items:center;gap:6px;}
  .veh-label{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:5px;margin-bottom:4px;}
  .veh-name{font-size:20px;font-weight:700;}
  .veh-plate{font-size:13px;color:var(--text-faint);margin-top:2px;}
  .status-banner{border-radius:12px;padding:14px 16px;margin:14px 0;display:flex;align-items:flex-start;gap:10px;}
  .status-banner.erledigt{background:var(--greenbg);color:var(--green);}
  .status-banner.pruefung{background:var(--amberbg);color:var(--amber);}
  .status-banner.arbeit{background:var(--bluebg);color:var(--blue);}
  .status-banner .sb-title{font-weight:700;font-size:14.5px;}
  .status-banner .sb-sub{font-size:12.5px;opacity:.85;margin-top:2px;}
  .desc-box{background:var(--panel2);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:6px;color:var(--text);}
  .steps{margin-top:6px;}
  .steps-label{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}
  .step-grid{display:grid;grid-template-columns:1fr 1fr;gap-row:10px;}
  .step-item{display:flex;align-items:center;gap:8px;padding:6px 4px;}
  .step-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;flex-shrink:0;}
  .step-dot.done{background:var(--green);color:#fff;}
  .step-dot.current{background:var(--accent);color:#fff;}
  .step-dot.pending{background:var(--panel2);color:var(--text-faint);border:1px solid var(--border);}
  .step-name{font-size:13px;}
  .step-item.pending .step-name{color:var(--text-faint);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mini-card{background:var(--panel2);border-radius:10px;padding:12px;}
  .mini-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .mini-val{font-size:14.5px;font-weight:600;}
  .mini-val.warn{color:var(--amber);}
  .mini-val.missing{color:var(--text-faint);font-weight:400;font-size:13px;}
  .approval{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel2);}
  .approval-title{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .approval-desc{font-size:13px;color:var(--text-faint);margin-bottom:8px;line-height:1.4;}
  .approval-cost{font-size:14px;font-weight:600;color:var(--accent2);margin-bottom:10px;}
  .approval-status{font-size:12.5px;padding:4px 10px;border-radius:14px;display:inline-block;margin-bottom:8px;font-weight:600;}
  .approval-status.offen{background:var(--amberbg);color:var(--amber);}
  .approval-status.freigegeben{background:var(--greenbg);color:var(--green);}
  .approval-status.abgelehnt{background:var(--redbg);color:var(--red);}
  .approval-status.rueckruf_angefordert{background:var(--bluebg);color:var(--blue);}
  .btn-row{display:flex;gap:8px;margin-top:4px;}
  .btn{flex:1;border:none;border-radius:10px;padding:11px 8px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn:disabled{opacity:.5;cursor:default;}
  .doc-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;
    text-decoration:none;color:var(--text);}
  .doc-icon{width:36px;height:36px;border-radius:9px;background:var(--bluebg);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .doc-title{font-size:13.5px;font-weight:600;}
  .doc-date{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .report-summary{background:var(--panel2);border-radius:10px;padding:14px;}
  .report-summary .rs-type{font-size:12px;color:var(--accent2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .report-summary .rs-title{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .report-summary .rs-desc{font-size:13px;color:var(--text-faint);line-height:1.5;}
  .report-summary .rs-date{font-size:11.5px;color:var(--text-faint);margin-top:8px;}
  .appt-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
  .appt-item:last-child{border-bottom:none;}
  .appt-date{width:52px;flex-shrink:0;text-align:center;}
  .appt-date .d{font-size:17px;font-weight:700;}
  .appt-date .m{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;}
  .appt-body{flex:1;}
  .appt-title{font-size:14px;font-weight:600;}
  .appt-sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .appt-status{font-size:11px;padding:3px 9px;border-radius:12px;display:inline-block;margin-top:6px;font-weight:600;}
  .appt-status.bestaetigt{background:var(--greenbg);color:var(--green);}
  .appt-status.offen{background:var(--amberbg);color:var(--amber);}
  .appt-status.storniert{background:var(--redbg);color:var(--red);}
  .appt-status.abgeschlossen{background:var(--panel2);color:var(--text-faint);}
  .appt-cancel{background:none;border:none;color:var(--text-faint);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:6px;padding:0;}
  .empty{color:var(--text-faint);font-size:13px;text-align:center;padding:20px 10px;}
  .toggle-book{color:var(--accent2);font-size:14px;font-weight:600;cursor:pointer;text-align:center;padding:10px;
    border:1.5px dashed var(--border);border-radius:12px;margin-top:8px;}
  .anliegen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .anliegen-tile{border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;}
  .anliegen-tile.active{border-color:var(--accent);background:var(--bluebg);}
  .anliegen-tile .at-title{font-weight:700;font-size:13.5px;}
  .anliegen-tile .at-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .service-list-label{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin:12px 0 8px;}
  .service-opt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--border);
    border-radius:11px;margin-bottom:8px;cursor:pointer;}
  .service-opt.active{border-color:var(--accent);background:var(--bluebg);}
  .service-opt .so-name{font-weight:600;font-size:13.5px;}
  .service-opt .so-dur{font-size:11px;color:var(--text-faint);}
  .service-opt .so-price{font-size:12.5px;color:var(--text-faint);white-space:nowrap;}
  .date-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .date-chip{flex-shrink:0;width:56px;text-align:center;padding:10px 4px;border:1.5px solid var(--border);border-radius:11px;cursor:pointer;}
  .date-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .date-chip .dc-day{font-size:10px;text-transform:uppercase;opacity:.7;}
  .date-chip .dc-num{font-size:16px;font-weight:700;margin:2px 0;}
  .date-chip .dc-mon{font-size:10px;opacity:.7;}
  .time-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
  .time-chip{padding:10px 4px;border:1.5px solid var(--border);border-radius:9px;text-align:center;font-size:13px;cursor:pointer;}
  .time-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .channel-row{display:flex;gap:8px;margin-bottom:16px;}
  .channel-chip{flex:1;padding:10px 6px;border:1.5px solid var(--border);border-radius:9px;text-align:center;font-size:12.5px;cursor:pointer;}
  .channel-chip.active{border-color:var(--accent);color:var(--accent2);background:var(--bluebg);font-weight:600;}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px 24px;width:100%;max-width:380px;text-align:center;}
  .login-card input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:14px;font-size:16px;text-align:center;letter-spacing:1px;margin:16px 0;}
  .login-card .btn{width:100%;}
  .error-msg{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;}
</style>
</head>

async function callPortal(action, extra){
  const res = await fetch(PORTAL_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action}, extra||{})),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Fehler');
  return data;
}

async function doLogin(){
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  const token = document.getElementById('tokenInput').value.trim();
  errEl.textContent = '';
  if(!token){ errEl.textContent = 'Bitte Code eingeben.'; return; }
  btn.disabled = true; btn.textContent = 'Lädt...';
  try{
    const data = await callPortal('get', {token});
    data.appointments = (data.appointments||[]).filter(a => a.customer_token === token);
    state.token = token;
    state.data = data;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    render();
  }catch(e){
    errEl.textContent = e.message === 'not_found' ? 'Kein Auftrag zu diesem Code gefunden.' : 'Code ungültig oder Verbindung fehlgeschlagen.';
  }finally{
    btn.disabled = false; btn.textContent = 'Anzeigen';
  }
}

async function reload(){
  const data = await callPortal('get', {token: state.token});
  data.appointments = (data.appointments||[]).filter(a => a.customer_token === state.token);
  state.data = data;
  render();
}

function fmtDate(iso){
  if(!iso) return null;
  const d = new Date(iso + (iso.length<=10 ? 'T00:00:00' : ''));
  if(isNaN(d)) return null;
  return d;
}
function fmtDDMM(d){ return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }

function render(){
  const el = document.getElementById('appScreen');

    <div class="topbar">
      <img src="${LOGO_SRC}" alt="AutoLeitwerk">
      <div><div class="tb-title">AutoLeitwerk</div><div class="tb-sub">Kundenportal</div></div>
    </div>
    <div class="content">

}

function goToService(){ state.view = 'service'; render(); window.scrollTo(0,0); }

    <div class="card">
      <div class="veh-label">🚗 Ihr Fahrzeug</div>
      <div class="veh-name">${o.vehicle_brand||''} ${o.vehicle_model||''}</div>
      <div class="veh-plate">${o.license_plate||''}</div>
      <div class="grid2" style="margin-top:14px;">
        <div class="mini-card">
          <div class="mini-label">Kilometerstand</div>
          <div class="mini-val">${o.mileage!=null ? o.mileage.toLocaleString('de-DE')+' km' : '–'}</div>
        </div>
        <div class="mini-card">
          <div class="mini-label">Kraftstoff</div>
          <div class="mini-val">${o.vehicle_brand ? (o.description&&o.description.includes('Diesel')?'Diesel':'–') : '–'}</div>
        </div>

        </div>

      <button class="btn primary" style="width:100%;margin-top:6px;" onclick="goToService()">Details &amp; Kundenportal öffnen →</button>

}

function renderServiceView(){
  const o = state.data.order;
  return `
    <div class="toggle-book" style="border:none;text-align:left;padding:4px 0 12px;color:var(--accent2);" onclick="goToDashboard()">← Zurück zum Dashboard</div>
    ${renderStatusCard(o)}
    ${renderServicebericht()}
    ${renderHuAuBerichte()}
    ${renderApprovals()}
    ${renderAppointmentsAndBooking()}
  `;
}

function renderStatusCard(o){
  const simple = simplifiedStatus(o.status);
  const [title, sub] = STATUS_BANNER_TEXT[o.status] || ['Status: ' + o.status, ''];
  const currentIdx = STEP_SEQUENCE.findIndex(s=>s.key===o.status);
  return `
    <div class="card">
      <div class="veh-label">🚗 Ihr Fahrzeug</div>
      <div class="veh-name">${o.vehicle_brand||''} ${o.vehicle_model||''}</div>
      <div class="veh-plate">${o.license_plate||''}</div>

      <div class="status-banner ${simple}">
        <div>
          <div class="sb-title">${title}</div>
          <div class="sb-sub">${o.estimated_completion_text || sub}</div>
        </div>
      </div>

      ${o.description ? `<div class="desc-box">${o.description}</div>` : ''}

      <div class="steps">
        <div class="steps-label">Ablauf</div>
        <div class="step-grid">
          ${STEP_SEQUENCE.map((s,i)=>{
            const cls = i<currentIdx ? 'done' : (i===currentIdx ? 'current' : 'pending');
            const mark = cls==='done' ? '✓' : (i+1);
            return `
            <div class="step-item ${cls}">
              <div class="step-dot ${cls}">${mark}</div>
              <div class="step-name">${s.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderFaelligkeiten(o){
  const tuvDate = fmtDate(o.tuv_next_date);
  const serviceDate = fmtDate(o.next_service_date);
  const now = new Date();
  const tuvSoon = tuvDate && ((tuvDate-now)/(1000*3600*24) < 60);
  return `
    <div class="card">
      <div class="card-title">🔧 Fälligkeiten</div>
      <div class="grid2">
        <div class="mini-card">
          <div class="mini-label">HU/AU fällig</div>
          ${tuvDate ? `<div class="mini-val ${tuvSoon?'warn':''}">${fmtDDMM(tuvDate)}</div>` : `<div class="mini-val missing">nicht hinterlegt</div>`}
        </div>
        <div class="mini-card">
          <div class="mini-label">Nächster Service</div>
          ${serviceDate ? `<div class="mini-val">${fmtDDMM(serviceDate)}</div>` : `<div class="mini-val missing">nicht hinterlegt</div>`}
        </div>
      </div>
    </div>
  `;
}

// existiert nicht). Dieser Demo-Eintrag zeigt nur, wie ein echter Bericht aussehen würde,

  log_date: '2026-08-31',
  employee_name: 'Marco Bianchi',
};

      <div class="report-summary">

let currentDocs = [];

      ${currentDocs.length ? currentDocs.map((d,i)=>`

        </div>

    </div>
  `;
}

// iOS Safari öffnet große data:-Links oft nicht zuverlässig als direkter Link/Tab.
// Deshalb wird die Datei bei Bedarf in einen Blob umgewandelt, das funktioniert stabiler.
function openDocument(index){
  const url = currentDocs[index].file_url;
  if(url.startsWith('data:')){
    try{
      const [header, b64] = url.split(',');
      const mime = (header.match(/data:([^;]+)/)||[])[1] || 'application/octet-stream';
      const byteChars = atob(b64);
      const byteNumbers = new Array(byteChars.length);
      for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
      const blob = new Blob([new Uint8Array(byteNumbers)], {type:mime});
      const blobUrl = URL.createObjectURL(blob);
      window.open(blobUrl, '_blank');
    }catch(e){
      alert('Dokument konnte nicht geöffnet werden.');
    }
  } else {
    window.open(url, '_blank', 'noopener');
  }
}

function renderApprovals(){
  const approvals = (state.data.approvals||[]).filter(a=>a.status==='offen' || a.description);
  if(!approvals.length) return '';
  return `
    <div class="card">
      <div class="card-title">✅ Freigaben</div>
      ${approvals.map(a=>`
        <div class="approval">
          <div class="approval-status ${a.status}">${APPROVAL_LABELS[a.status]||a.status}</div>
          <div class="approval-title">${a.title||''}</div>
          <div class="approval-desc">${a.description||''}</div>
          ${a.additional_cost ? `<div class="approval-cost">+ ${a.additional_cost.toLocaleString('de-DE')} €</div>` : ''}
          ${a.status==='offen' ? `
            <div class="btn-row">
              <button class="btn primary" onclick="respondApproval('${a.id}','freigegeben')">Freigeben</button>
              <button class="btn outline" onclick="respondApproval('${a.id}','abgelehnt')">Ablehnen</button>
              <button class="btn outline" onclick="respondApproval('${a.id}','rueckruf_angefordert')">Rückruf</button>
            </div>
          ` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

async function respondApproval(approvalId, decision){
  try{ await callPortal('respond', { approval_id: approvalId, decision }); await reload(); }
  catch(e){ alert('Fehler: ' + e.message); }
}

function nextNDays(n){
  const days = [];
  const today = new Date();
  for(let i=0;i<n;i++){ const d = new Date(today); d.setDate(today.getDate()+i); days.push(d); }
  return days;
}
const TIME_SLOTS = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','13:00','13:30','14:00','14:30','15:00','15:30'];

function renderAppointmentsAndBooking(){
  const appts = (state.data.appointments||[]).slice().sort((a,b)=> (a.appointment_date+a.time_slot).localeCompare(b.appointment_date+b.time_slot));
  const services = state.data.services || [];

  return `
    <div class="card">
      <div class="card-title">📅 Termin buchen</div>
      ${state.showBookForm ? renderBookForm(services) : `<div class="toggle-book" onclick="toggleBook()">+ Wählen Sie einen freien Slot – ganz ohne Telefon</div>`}

      <div class="steps-label" style="margin-top:18px;">Ihre gebuchten Termine</div>
      ${appts.length ? appts.map(a=>{
        const d = fmtDate(a.appointment_date);
        return `
        <div class="appt-item">
          <div class="appt-date"><div class="d">${d?d.getDate():'–'}</div><div class="m">${d?MONATE[d.getMonth()]:''}</div></div>
          <div class="appt-body">
            <div class="appt-title">${a.service_name || (a.appointment_type==='fahrzeugabgabe'?'Fahrzeugabgabe':(a.appointment_type||'Termin'))}</div>
            <div class="appt-sub">${a.time_slot||''}${a.end_time?' – '+a.end_time:''} Uhr</div>
            <span class="appt-status ${a.status}">${APPT_STATUS_LABELS[a.status]||a.status}</span>
            ${(a.status==='bestaetigt'||a.status==='offen') ? `<div><button class="appt-cancel" onclick="cancelAppt('${a.id}')">Termin stornieren</button></div>` : ''}
          </div>
        </div>`;
      }).join('') : '<div class="empty">Noch keine Termine gebucht.</div>'}
    </div>
  `;
}

function toggleBook(){ state.showBookForm = !state.showBookForm; render(); }
function selectAnliegen(key){ state.bookAnliegen = key; render(); }
function selectService(id){ state.bookServiceId = (state.bookServiceId===id ? null : id); render(); }
function selectDate(iso){ state.bookDate = iso; render(); }
function selectTime(t){ state.bookTime = t; render(); }
function selectChannel(c){ state.bookChannel = c; render(); }

function renderBookForm(services){
  const days = nextNDays(10);
  if(!state.bookDate) state.bookDate = days[0].toISOString().slice(0,10);
  const selectedService = services.find(s=>s.id===state.bookServiceId);

  return `
    <div class="steps-label">Anliegen</div>
    <div class="anliegen-grid">
      ${ANLIEGEN.map(a=>`
        <div class="anliegen-tile ${state.bookAnliegen===a.key?'active':''}" onclick="selectAnliegen('${a.key}')">
          <div class="at-title">${a.title}</div>
          <div class="at-sub">${a.sub}</div>
        </div>
      `).join('')}
    </div>

    <div class="service-list-label">Dienstleistung wählen (optional)</div>
    ${services.map(s=>`
      <div class="service-opt ${state.bookServiceId===s.id?'active':''}" onclick="selectService('${s.id}')">
        <div><div class="so-name">${s.name}</div><div class="so-dur">${s.estimated_duration_minutes} Min.</div></div>
        <div class="so-price">${s.price_range_min!=null?s.price_range_min.toFixed(2).replace('.',','):'?'} €–${s.price_range_max!=null?s.price_range_max.toFixed(2).replace('.',','):'?'} €</div>
      </div>
    `).join('')}

    <div class="steps-label" style="margin-top:16px;">Datum wählen</div>
    <div class="date-row">
      ${days.map(d=>{
        const iso = d.toISOString().slice(0,10);
        return `
        <div class="date-chip ${state.bookDate===iso?'active':''}" onclick="selectDate('${iso}')">
          <div class="dc-day">${WOCHENTAGE[d.getDay()]}</div>
          <div class="dc-num">${d.getDate()}</div>
          <div class="dc-mon">${MONATE[d.getMonth()]}</div>
        </div>`;
      }).join('')}
    </div>

    <div class="steps-label">Uhrzeit wählen</div>
    <div class="time-grid">
      ${TIME_SLOTS.map(t=>`<div class="time-chip ${state.bookTime===t?'active':''}" onclick="selectTime('${t}')">${t}</div>`).join('')}
    </div>

    <div class="steps-label">Bestätigung erhalten via</div>
    <div class="channel-row">
      <div class="channel-chip ${state.bookChannel==='email'?'active':''}" onclick="selectChannel('email')">✉️ E-Mail</div>
      <div class="channel-chip ${state.bookChannel==='sms'?'active':''}" onclick="selectChannel('sms')">📱 SMS</div>
      <div class="channel-chip ${state.bookChannel==='whatsapp'?'active':''}" onclick="selectChannel('whatsapp')">💬 WhatsApp</div>
    </div>

    <button class="btn primary" style="width:100%;" onclick="submitBooking()" ${!state.bookTime?'disabled':''}>📅 Termin verbindlich buchen</button>
    <div class="toggle-book" style="border:none;color:var(--text-faint);" onclick="toggleBook()">Abbrechen</div>
  `;
}

async function submitBooking(){
  const o = state.data.order;
  if(!state.bookDate || !state.bookTime){ alert('Bitte Datum und Uhrzeit wählen.'); return; }
  const services = state.data.services || [];
  const svc = services.find(s=>s.id===state.bookServiceId);
  try{
    await callPortal('book', { appointment: {
      order_id: o.id,
      appointment_date: state.bookDate,
      time_slot: state.bookTime,
      appointment_type: state.bookAnliegen,
      service_id: svc ? svc.id : null,
      service_name: svc ? svc.name : null,
      customer_name: o.customer_name,
      customer_token: state.token,
      vehicle_brand: o.vehicle_brand,
      vehicle_model: o.vehicle_model,
      license_plate: o.license_plate,
      phone: o.phone,
      email: o.email,
      notification_channel: state.bookChannel,
    }});
    state.showBookForm = false;
    state.bookTime = null; state.bookServiceId = null;
    await reload();
  }catch(e){ alert('Fehler bei der Buchung: ' + e.message); }
}

async function cancelAppt(id){
  if(!confirm('Termin wirklich stornieren?')) return;
  try{ await callPortal('cancel', { appointment_id: id }); await reload(); }
  catch(e){ alert('Fehler: ' + e.message); }
}
</script>

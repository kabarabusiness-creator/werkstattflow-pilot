<style>
  :root{
    --bg:#f4f4f7; --panel:#ffffff; --panel2:#f7f6fb; --border:#e6e5f0;
    --accent:#8b5cf6; --accent2:#7c3aed; --text:#1a1a2e; --text-faint:#8a8aa8;
    --green:#22c55e; --greenbg:#e8f9ee; --amber:#f59e0b; --amberbg:#fef6e7;
    --red:#f2495c; --redbg:#fdeaec; --blue:#3b82f6; --bluebg:#eaf1fd;
  }
  @media (prefers-color-scheme: dark) {
    :root{
      --bg:#0d0d16; --panel:#161625; --panel2:#1c1c30; --border:#2a2a45;
      --accent:#a78bfa; --accent2:#c4b5fd; --text:#f0f0f5; --text-faint:#8a8aa8;
      --green:#4ade80; --greenbg:rgba(34,197,94,.16); --amber:#fbbf24; --amberbg:rgba(245,158,11,.16);
      --red:#f87171; --redbg:rgba(242,73,92,.16); --blue:#60a5fa; --bluebg:rgba(59,130,246,.16);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .wrap{max-width:480px;margin:0 auto;padding:0 0 60px;}
  .topbar{background:linear-gradient(135deg,#1a1a2e,#2a1a4e);color:#fff;padding:18px 18px 22px;
    display:flex;align-items:center;gap:12px;border-radius:0 0 18px 18px;}
  .topbar img{height:30px;}
  .topbar .tb-title{font-weight:700;font-size:16px;}
  .topbar .tb-sub{font-size:12px;opacity:.7;}
  .content{padding:16px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card-title{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;
    display:flex;align-items:center;gap:6px;}
  .veh-label{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:5px;margin-bottom:4px;}
  .veh-name{font-size:20px;font-weight:700;}
  .veh-plate{font-size:13px;color:var(--text-faint);margin-top:2px;}
  .status-banner{border-radius:12px;padding:14px 16px;margin:14px 0;display:flex;align-items:flex-start;gap:10px;}
  .status-banner.erledigt{background:var(--greenbg);color:var(--green);}
  .status-banner.pruefung{background:var(--amberbg);color:var(--amber);}
  .status-banner.arbeit{background:var(--bluebg);color:var(--blue);}
  .status-banner .sb-title{font-weight:700;font-size:14.5px;}
  .status-banner .sb-sub{font-size:12.5px;opacity:.85;margin-top:2px;}
  .desc-box{background:var(--panel2);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:6px;color:var(--text);}
  .steps{margin-top:6px;}
  .steps-label{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}
  .step-grid{display:grid;grid-template-columns:1fr 1fr;gap-row:10px;}
  .step-item{display:flex;align-items:center;gap:8px;padding:6px 4px;}
  .step-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;flex-shrink:0;}
  .step-dot.done{background:var(--green);color:#fff;}
  .step-dot.current{background:var(--accent);color:#fff;}
  .step-dot.pending{background:var(--panel2);color:var(--text-faint);border:1px solid var(--border);}
  .step-name{font-size:13px;}
  .step-item.pending .step-name{color:var(--text-faint);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mini-card{background:var(--panel2);border-radius:10px;padding:12px;}
  .mini-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .mini-val{font-size:14.5px;font-weight:600;}
  .mini-val.warn{color:var(--amber);}
  .mini-val.missing{color:var(--text-faint);font-weight:400;font-size:13px;}
  .approval{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel2);}
  .approval-title{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .approval-desc{font-size:13px;color:var(--text-faint);margin-bottom:8px;line-height:1.4;}
  .approval-cost{font-size:14px;font-weight:600;color:var(--accent2);margin-bottom:10px;}
  .approval-status{font-size:12.5px;padding:4px 10px;border-radius:14px;display:inline-block;margin-bottom:8px;font-weight:600;}
  .approval-status.offen,.approval-status.ausstehend{background:var(--amberbg);color:var(--amber);}
  .approval-status.freigegeben{background:var(--greenbg);color:var(--green);}
  .approval-status.abgelehnt{background:var(--redbg);color:var(--red);}
  .approval-status.rueckruf_angefordert{background:var(--bluebg);color:var(--blue);}
  .btn-row{display:flex;gap:8px;margin-top:4px;}
  .btn{flex:1;border:none;border-radius:10px;padding:11px 8px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn:disabled{opacity:.5;cursor:default;}
  .doc-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;
    text-decoration:none;color:var(--text);}
  .doc-icon{width:36px;height:36px;border-radius:9px;background:var(--bluebg);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .doc-title{font-size:13.5px;font-weight:600;}
  .doc-date{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .report-summary{background:var(--panel2);border-radius:10px;padding:14px;}
  .report-summary .rs-type{font-size:12px;color:var(--accent2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .report-summary .rs-title{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .report-summary .rs-desc{font-size:13px;color:var(--text-faint);line-height:1.5;}
  .report-summary .rs-date{font-size:11.5px;color:var(--text-faint);margin-top:8px;}
  .appt-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
  .appt-item:last-child{border-bottom:none;}
  .appt-date{width:52px;flex-shrink:0;text-align:center;}
  .appt-date .d{font-size:17px;font-weight:700;}
  .appt-date .m{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;}
  .appt-body{flex:1;}
  .appt-title{font-size:14px;font-weight:600;}
  .appt-sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .appt-status{font-size:11px;padding:3px 9px;border-radius:12px;display:inline-block;margin-top:6px;font-weight:600;}
  .appt-status.bestaetigt{background:var(--greenbg);color:var(--green);}
  .appt-status.offen{background:var(--amberbg);color:var(--amber);}
  .appt-status.storniert{background:var(--redbg);color:var(--red);}
  .appt-status.abgeschlossen{background:var(--panel2);color:var(--text-faint);}
  .appt-cancel{background:none;border:none;color:var(--text-faint);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:6px;padding:0;}
  .empty{color:var(--text-faint);font-size:13px;text-align:center;padding:20px 10px;}
  .toggle-book{color:var(--accent2);font-size:14px;font-weight:600;cursor:pointer;text-align:center;padding:10px;
    border:1.5px dashed var(--border);border-radius:12px;margin-top:8px;}
  .anliegen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .anliegen-tile{border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;}
  .anliegen-tile.active{border-color:var(--accent);background:var(--bluebg);}
  .anliegen-tile .at-title{font-weight:700;font-size:13.5px;}
  .anliegen-tile .at-sub{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .service-list-label{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-faint);margin:12px 0 8px;}
  .service-opt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--border);
    border-radius:11px;margin-bottom:8px;cursor:pointer;}
  .service-opt.active{border-color:var(--accent);background:var(--bluebg);}
  .service-opt .so-name{font-weight:600;font-size:13.5px;}
  .service-opt .so-dur{font-size:11px;color:var(--text-faint);}
  .service-opt .so-price{font-size:12.5px;color:var(--text-faint);white-space:nowrap;}
  .date-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .date-chip{flex-shrink:0;width:56px;text-align:center;padding:10px 4px;border:1.5px solid var(--border);border-radius:11px;cursor:pointer;}
  .date-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .date-chip .dc-day{font-size:10px;text-transform:uppercase;opacity:.7;}
  .date-chip .dc-num{font-size:16px;font-weight:700;margin:2px 0;}
  .date-chip .dc-mon{font-size:10px;opacity:.7;}
  .time-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
  .time-chip{padding:10px 4px;border:1.5px solid var(--border);border-radius:9px;text-align:center;font-size:13px;cursor:pointer;}
  .time-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .channel-row{display:flex;gap:8px;margin-bottom:16px;}
  .channel-chip{flex:1;padding:10px 6px;border:1.5px solid var(--border);border-radius:9px;text-align:center;font-size:12.5px;cursor:pointer;}
  .channel-chip.active{border-color:var(--accent);color:var(--accent2);background:var(--bluebg);font-weight:600;}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px 24px;width:100%;max-width:380px;text-align:center;}
  .login-card input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:14px;font-size:16px;text-align:center;letter-spacing:1px;margin:16px 0;}
  .login-card .btn{width:100%;}
  .error-msg{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;}
  .greet-title{font-size:20px;font-weight:700;}
  .greet-sub{font-size:13px;color:var(--text-faint);margin-top:2px;}
  .veh-photo{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin:12px 0 2px;background:var(--panel2);}
  .veh-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .demo-note{font-size:10.5px;color:var(--text-faint);margin-top:8px;}
  .chat-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px 2px;margin-bottom:10px;}
  .chat-bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;}
  .chat-bubble.kunde{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
  .chat-bubble.werkstatt{align-self:flex-start;background:var(--panel2);color:var(--text);border-bottom-left-radius:4px;}
  .chat-meta{font-size:10px;opacity:.7;margin-top:3px;}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:13.5px;color:var(--text);}
  .chat-note{font-size:11.5px;color:var(--text-faint);margin-top:8px;text-align:center;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;"><svg width="30" height="30" viewBox="0 0 64 64" style="flex-shrink:0;"><defs><linearGradient id="loginLogoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#c026d3"/></linearGradient></defs><polygon points="24,8 36,8 27,44 56,44 53,56 12,56" fill="url(#loginLogoGrad)"/><polygon points="41,8 53,8 50,20 38,20" fill="var(--panel)"/></svg><div style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;font-weight:700;font-style:italic;font-size:18px;letter-spacing:.3px;"><span style="color:var(--text-faint);">AUTO</span><span style="color:var(--text);">LEITWERK</span></div></div>
    <h1 style="font-size:19px;margin:0 0 4px;">Mein Fahrzeug</h1>
    <h2 style="font-size:14px;color:var(--text-faint);margin:0 0 4px;font-weight:500;">Status, Termine &amp; Berichte</h2>
    <input type="text" id="tokenInput" placeholder="Zugangscode eingeben" autocapitalize="off" autocorrect="off">
    <div class="error-msg" id="loginError"></div>
    <button class="btn primary" id="loginBtn" onclick="doLogin()">Anzeigen</button>
  </div>
</div>

<div id="appScreen" class="wrap" style="display:none;"></div>

<script>
const PORTAL_URL = 'https://kabaradigitalprototyp.base44.app/functions/portalApi';
const LOGO_SRC = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIHhtbG5zOmMycGE9Imh0dHA6Ly9jMnBhLm9yZy9tYW5pZmVzdCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjOGI1Y2Y2Ij48L3N0b3A+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjYzAyNmQzIj48L3N0b3A+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHBvbHlnb24gcG9pbnRzPSIyNCw4IDM2LDggMjcsNDQgNTYsNDQgNTMsNTYgMTIsNTYiIGZpbGw9InVybCgjZykiPjwvcG9seWdvbj48cG9seWdvbiBwb2ludHM9IjQxLDggNTMsOCA1MCwyMCAzOCwyMCIgZmlsbD0iI2ZmZmZmZiI+PC9wb2x5Z29uPjwvc3ZnPg==';

const STEP_SEQUENCE = [
  {key:'fahrzeug_angenommen', label:'Angenommen'},
  {key:'diagnose_laeuft', label:'Diagnose'},
  {key:'kostenvoranschlag', label:'Kostenvoranschlag'},
  {key:'freigabe_erforderlich', label:'Freigabe nötig'},
  {key:'ersatzteile_bestellt', label:'Teile bestellt'},
  {key:'warte_auf_ersatzteile', label:'Warte auf Teile'},
  {key:'reparatur_laeuft', label:'Reparatur'},
  {key:'qualitaetspruefung', label:'Qualitätsprüfung'},
  {key:'abholbereit', label:'Abholbereit'},
  {key:'abgeschlossen', label:'Abgeschlossen'},
];
function simplifiedStatus(s){
  if(s==='abgeschlossen') return 'erledigt';
  if(['freigabe_erforderlich','kostenvoranschlag','ersatzteile_bestellt','warte_auf_ersatzteile'].includes(s)) return 'pruefung';
  return 'arbeit';
}
const STATUS_BANNER_TEXT = {
  fahrzeug_angenommen:['Ihr Fahrzeug wurde angenommen','Wir beginnen in Kürze mit der Diagnose.'],
  diagnose_laeuft:['Diagnose läuft','Wir prüfen aktuell Ihr Fahrzeug.'],
  kostenvoranschlag:['Kostenvoranschlag wird erstellt','Sie erhalten in Kürze eine Rückmeldung.'],
  freigabe_erforderlich:['Ihre Freigabe ist erforderlich','Bitte prüfen Sie die Anfrage unten.'],
  ersatzteile_bestellt:['Ersatzteile wurden bestellt','Wir informieren Sie, sobald sie eintreffen.'],
  warte_auf_ersatzteile:['Wir warten auf Ersatzteile','Die Reparatur startet, sobald diese eintreffen.'],
  reparatur_laeuft:['Reparatur läuft','Ihr Fahrzeug wird aktuell bearbeitet.'],
  qualitaetspruefung:['Qualitätsprüfung läuft','Abschließende Kontrolle vor der Übergabe.'],
  abholbereit:['Ihr Fahrzeug ist abholbereit!','Wir freuen uns auf Sie!'],
  abgeschlossen:['Auftrag abgeschlossen','Vielen Dank für Ihren Besuch.'],
};
const APPROVAL_LABELS = { ausstehend:'Wartet auf Ihre Freigabe', offen:'Offen', freigegeben:'Freigegeben', abgelehnt:'Abgelehnt', rueckruf_angefordert:'Rückruf angefordert' };
const APPT_STATUS_LABELS = { bestaetigt:'Bestätigt', offen:'Angefragt', storniert:'Storniert', abgeschlossen:'Abgeschlossen' };
const MONATE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WOCHENTAGE = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const ANLIEGEN = [
  {key:'fahrzeugabgabe', title:'Fahrzeugabgabe', sub:'Fahrzeug zur Reparatur übergeben'},
  {key:'reifenwechsel', title:'Reifenwechsel', sub:'Sommer- oder Winterreifen'},
  {key:'inspektion', title:'Inspektion', sub:'Reguläre Wartung'},
  {key:'sonstiges', title:'Sonstiges', sub:'Beratung & anderes'},
];

let state = { token:null, data:null, view:'dashboard', showBookForm:false, bookAnliegen:'fahrzeugabgabe', bookServiceId:null, bookDate:null, bookTime:null, bookChannel:'email', chatDraft:'', chatSending:false, chatError:null };

function firstName(name){
  if(!name) return '';
  return name.trim().split(/\s+/)[0];
}
function greeting(){
  const h = new Date().getHours();
  if(h < 11) return 'Guten Morgen';
  if(h < 18) return 'Hallo';
  return 'Guten Abend';
}
// Fahrzeugfoto: wird automatisch angezeigt, sobald die Werkstatt (im Tablet/Backend)
// ein Foto zum Auftrag/Fahrzeug hinterlegt (Feld o.image_url). Ohne Foto bleibt der
// Bereich einfach leer – es wird kein Platzhalter-/Fremdbild angezeigt.
function vehiclePhotoHtml(o){
  const url = o.vehicle_photo || o.image_url; // Backend-Feld heißt seit 01.10. vehicle_photo
  if(!url) return '';
  return `<div class="veh-photo"><img src="${url}" alt="${(o.vehicle_brand||'')+' '+(o.vehicle_model||'')}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;
}

document.getElementById('tokenInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
const urlParams = new URLSearchParams(window.location.search);
const urlToken = urlParams.get('token');
if(urlToken){ document.getElementById('tokenInput').value = urlToken; doLogin(); }

async function callPortal(action, extra){
  const res = await fetch(PORTAL_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({action, token: state.token}, extra||{})),
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Fehler');
  return data;
}

async function doLogin(){
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  const token = document.getElementById('tokenInput').value.trim();
  errEl.textContent = '';
  if(!token){ errEl.textContent = 'Bitte Code eingeben.'; return; }
  btn.disabled = true; btn.textContent = 'Lädt...';
  try{
    const data = await callPortal('get', {token});
    data.appointments = data.appointments || [];
    state.token = token;
    state.data = data;
    try{ if(window.location.search.indexOf('token=')>=0) history.replaceState(null,'',window.location.pathname); }catch(_){}
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    render();
  }catch(e){
    errEl.textContent = (e.message === 'not_found' || e.message === 'unauthorized') ? 'Kein Auftrag zu diesem Code gefunden.' : 'Verbindung fehlgeschlagen. Bitte erneut versuchen.';
  }finally{
    btn.disabled = false; btn.textContent = 'Anzeigen';
  }
}

// Chat mit der Werkstatt. Nachrichten kommen (sobald vorhanden) über state.data.messages
// aus der 'get'-Aktion mit; das Senden nutzt die Aktion 'message_send'. Unterstützt
// portalApi diese Aktionen noch nicht, zeigt renderChat/sendMessage einen freundlichen
// Hinweis statt eines Fehlers – kein Absturz, sobald die Function erweitert wird läuft
// der Chat ohne weitere Änderungen hier.
function renderChat(){
  // Chat erst anzeigen, wenn portalApi Nachrichten mitliefert (message_list/message_send
  // sind im Backend noch nicht umgesetzt) – sonst sähe der Kunde ein Feld, das nur Fehler liefert.
  if(!Array.isArray(state.data.messages)) return '';
  const msgs = (state.data.messages || []).slice().sort((a,b)=> (a.created_date||'').localeCompare(b.created_date||''));
  return `
    <div class="card">
      <div class="card-title">💬 Nachrichten</div>
      <div class="chat-list" id="chatList">
        ${msgs.length ? msgs.map(m=>`
          <div class="chat-bubble ${m.sender==='kunde'?'kunde':'werkstatt'}">
            ${m.content||''}
            <div class="chat-meta">${m.sender==='kunde' ? 'Sie' : (m.sender_name||'Werkstatt')}${m.created_date ? ' · '+fmtDDMM(fmtDate(m.created_date.slice(0,10))) : ''}</div>
          </div>
        `).join('') : `<div class="empty">Noch keine Nachrichten. Schreiben Sie uns, wenn Sie Fragen zu Ihrem Auftrag haben.</div>`}
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Nachricht an die Werkstatt…" value="${(state.chatDraft||'').replace(/"/g,'&quot;')}" oninput="state.chatDraft=this.value" onkeydown="if(event.key==='Enter') sendMessage();" ${state.chatSending?'disabled':''}>
        <button class="btn primary" style="flex:0 0 auto;padding:11px 16px;" onclick="sendMessage()" ${state.chatSending?'disabled':''}>Senden</button>
      </div>
      ${state.chatError ? `<div class="chat-note" style="color:var(--red);">${state.chatError}</div>` : `<div class="chat-note">Antworten der Werkstatt erscheinen hier.</div>`}
    </div>
  `;
}

async function sendMessage(){
  const text = (state.chatDraft||'').trim();
  if(!text || state.chatSending) return;
  const o = state.data.order;
  state.chatSending = true; state.chatError = null; render();
  try{
    await callPortal('message_send', {
      order_id: o.id,
      customer_token: state.token,
      sender: 'kunde',
      sender_name: o.customer_name,
      content: text,
    });
    state.chatDraft = '';
    await reload();
  }catch(e){
    state.chatError = 'Nachricht konnte gerade nicht gesendet werden – die Chat-Funktion wird noch eingerichtet.';
  }finally{
    state.chatSending = false;
    render();
    const list = document.getElementById('chatList');
    if(list) list.scrollTop = list.scrollHeight;
  }
}

// iOS Safari öffnet große data:-Links oft nicht zuverlässig als direkter Link/Tab.
// Deshalb wird die Datei bei Bedarf in einen Blob umgewandelt, das funktioniert stabiler.
function openDocument(index){
  const url = currentDocs[index].file_url;
  if(url.startsWith('data:')){
    try{
      const [header, b64] = url.split(',');
      const mime = (header.match(/data:([^;]+)/)||[])[1] || 'application/octet-stream';
      const byteChars = atob(b64);
      const byteNumbers = new Array(byteChars.length);
      for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
      const blob = new Blob([new Uint8Array(byteNumbers)], {type:mime});
      const blobUrl = URL.createObjectURL(blob);
      window.open(blobUrl, '_blank');
    }catch(e){
      alert('Dokument konnte nicht geöffnet werden.');
    }
  } else {
    window.open(url, '_blank', 'noopener');
  }
}

function nextNDays(n){
  const days = [];

  for(let i=0;i<n;i++){ const d = new Date(today); d.setDate(today.getDate()+i); days.push(d); }
  return days;
}

// Datum als YYYY-MM-DD in Ortszeit (toISOString() rechnet in UTC und verschiebt
// zwischen 0 und 2 Uhr nachts das Datum auf den Vortag).
function apptTypeTitle(t){ const x = ANLIEGEN.find(a=>a.key===t); return x ? x.title : 'Termin'; }
function localIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// Nur Dienstleistungen der eigenen Werkstatt anbieten (Backend liefert aktuell alle Werkstätten mit).
function bookableServices(){
  const wc = state.data.order && state.data.order.workshop_code;
  return (state.data.services||[]).filter(s => s.is_active!==false && (!wc || !s.workshop_code || s.workshop_code===wc));
}
function servicePriceLabel(s){
  const f = n => Number(n).toFixed(2).replace('.',',');
  if(s.price_range_min!=null && s.price_range_max!=null) return f(s.price_range_min)+' € – '+f(s.price_range_max)+' €';
  if(s.base_price!=null) return 'ab '+f(s.base_price)+' €';
  return '';
}
// Buchbare Tage: kein Sonntag; heute nur, wenn noch ein Slot frei ist.
function bookableDays(n){
  const out = []; const d = new Date();
  while(out.length < n){
    if(d.getDay()!==0 && freeSlotsFor(localIso(d)).length) out.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}
// Freie Slots: Vergangenheit (Puffer 60 Min.) und eigene bestehende Termine ausgeblendet.
// Eine echte Kapazitätsprüfung gegen alle Termine der Werkstatt muss im Backend passieren.
function freeSlotsFor(iso){
  const now = new Date();
  const own = new Set((state.data.appointments||[]).filter(a=>a.status!=='storniert' && String(a.appointment_date).slice(0,10)===iso).map(a=>String(a.time_slot).slice(0,5)));
  return TIME_SLOTS.filter(t=>{
    if(own.has(t)) return false;
    if(iso===localIso(now)){ const [h,m]=t.split(':').map(Number); const slot=new Date(now); slot.setHours(h,m,0,0); if(slot - now < 60*60*1000) return false; }
    return true;
  });
}

      ${ENABLE_SMS_WHATSAPP ? `<div class="channel-chip ${state.bookChannel==='sms'?'active':''}" onclick="selectChannel('sms')">📱 SMS</div>
      <div class="channel-chip ${state.bookChannel==='whatsapp'?'active':''}" onclick="selectChannel('whatsapp')">💬 WhatsApp</div>` : ''}
    </div>

    <button class="btn primary" style="width:100%;" onclick="submitBooking()" ${(!state.bookTime||state.bookSending)?'disabled':''}>${state.bookSending?'Wird gebucht…':'📅 Termin verbindlich buchen'}</button>
    <div class="toggle-book" style="border:none;color:var(--text-faint);" onclick="toggleBook()">Abbrechen</div>
  `;
}

async function submitBooking(){
  const o = state.data.order;
  if(state.bookSending) return;
  if(!state.bookDate || !state.bookTime){ alert('Bitte Datum und Uhrzeit wählen.'); return; }
  const services = bookableServices();
  state.bookSending = true; render();
  const svc = services.find(s=>s.id===state.bookServiceId);
  try{
    await callPortal('book', { appointment: {
      order_id: o.id,
      appointment_date: state.bookDate,
      time_slot: state.bookTime,
      appointment_type: state.bookAnliegen,
      service_id: svc ? svc.id : null,
      service_name: svc ? svc.name : null,
      customer_name: o.customer_name,
      customer_token: state.token,
      vehicle_brand: o.vehicle_brand,
      vehicle_model: o.vehicle_model,
      license_plate: o.license_plate,
      phone: o.phone,
      email: o.email,
      notification_channel: state.bookChannel,
    }});
    state.showBookForm = false;
    state.bookTime = null; state.bookServiceId = null;
    await reload();
  }catch(e){
    const msg = { slot_taken:'Dieser Termin ist leider schon vergeben – bitte wählen Sie eine andere Uhrzeit.', invalid_slot:'Dieser Termin kann nicht gebucht werden – bitte wählen Sie einen anderen Tag oder eine andere Uhrzeit.' }[e.message];
    alert(msg || 'Die Buchung hat nicht geklappt. Bitte versuchen Sie es erneut oder rufen Sie uns an.');
  }
  finally{ state.bookSending = false; render(); }
}

async function cancelAppt(id){
  if(!confirm('Termin wirklich stornieren?')) return;
  try{ await callPortal('cancel', { appointment_id: id }); await reload(); }
  catch(e){ alert('Fehler: ' + e.message); }
}
</script>

</html>

name = "werkstattflow-pilot"
main = "worker/src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true  # im Dashboard gesetzte Variablen bei jedem Deploy behalten

[vars]
BASE44_APP_ID = "6a6bfc939e9105b8cb310113"
ALLOWED_ORIGINS = "https://kabarabusiness-creator.github.io,https://autoleitwerk.base44.app"

[observability]
enabled = true

# Secrets NICHT hier eintragen, sondern in Cloudflare:
# Workers & Pages → autoleitwerk-api → Settings → Variables and Secrets
#   BASE44_TOKEN  (Typ: Secret)
#   ADMIN_KEY     (Typ: Secret)

# Foto-Speicher (Cloudflare KV, kostenlos bis 1 GB) – wird beim Deploy automatisch angelegt
[[kv_namespaces]]
binding = "PHOTOS"

# KI (ALEX + Reifenscan) über Cloudflare Workers AI – kein API-Key, kostenloses Tageskontingent.
# Auf dem Free-Plan wird nie etwas berechnet: ist das Kontingent leer, antwortet die KI bis 2 Uhr nachts nicht.
[ai]
binding = "AI"
